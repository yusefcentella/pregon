<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pregón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Diseño: panel oscuro verde-tinta, un solo acento (cempasúchil). Layout: barra fija + contenido en paneles de 20px. */
:root {
  color-scheme: dark;
  --bg: #0F1611; --panel: #151F19; --line: #27362E; --text: #E8EFE7; --muted: #9DB0A2;
  --accent: #F2B53D; --accent-ink: #1A1405; --ok: #6FD6A8; --bad: #F2907F;
  /* rampa de un solo tono, de tenue a brillante */
  --r0: #243024; --r1: #3E4423; --r2: #6A5A1E; --r3: #A47C20; --r4: #D6A02C; --r5: #FFCB57;
  /* categorías de gráfica (máximo 4, nunca para texto) */
  --c1: #F2B53D; --c2: #4FC3A1; --c3: #8BA3F5; --c4: #7C8F87;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.55 var(--body); -webkit-text-size-adjust: 100%; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; font-weight: 600; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, table { font-variant-numeric: tabular-nums; }
.disp { font-family: var(--display); font-weight: 700; letter-spacing: -0.01em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

/* barra superior */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 14px; min-height: 60px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font: 700 22px var(--display); }
.nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; align-items: center; }
.nav a { color: var(--muted); text-decoration: none; padding: 8px 12px; border-radius: 10px; font-weight: 500; }
.nav a:hover { color: var(--text); background: var(--panel); }
.nav a[aria-current="page"] { color: var(--text); background: var(--panel); border: 1px solid var(--line); padding: 7px 11px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 2px 10px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.chip.acc { color: var(--accent); border-color: #5b4a1b; }
.chip.ok { color: var(--ok); border-color: #2a5a49; }
.chip.live { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px rgba(242, 181, 61, .35); }
.subbar { background: var(--panel); border-bottom: 1px solid var(--line); font-size: 14px; }
.subbar .wrap { display: flex; gap: 12px; align-items: center; min-height: 40px; flex-wrap: wrap; padding-top: 6px; padding-bottom: 6px; }
.subbar .push { margin-left: auto; }

/* controles */
.btn { font: 600 15px var(--body); border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 10px 16px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.pri:hover { background: #ffc35a; }
.btn.sm { min-height: 34px; padding: 6px 12px; font-size: 14px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
input, select, textarea { font: 400 15px var(--body); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; min-height: 42px; }
textarea { resize: vertical; line-height: 1.45; }
input:hover, select:hover, textarea:hover { border-color: #3a4d43; }
input[type=checkbox] { width: 18px; height: 18px; min-height: 0; accent-color: var(--accent); }
label { font-size: 14px; color: var(--muted); display: block; margin-bottom: 4px; }
.field { display: flex; flex-direction: column; }
.err { color: var(--bad); font-size: 14px; margin-top: 4px; }
.hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
.seg button { font: 500 14px var(--body); background: none; color: var(--muted); border: 0; padding: 8px 14px; cursor: pointer; min-height: 38px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg button:focus-visible { outline-offset: -2px; }

/* paneles */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 20px; min-width: 0; }
.panel h2 { font: 700 20px var(--display); }
.panel h3 { font: 600 16px var(--body); }
.phead { display: flex; align-items: flex-start; gap: 12px; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); }
.main2 { grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); }
@media (max-width: 880px) { .main2 { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.kpi .v { font: 700 34px/1.1 var(--display); margin: 6px 0 8px; }
.delta { font-size: 14px; font-weight: 600; }
.delta.up { color: var(--ok); } .delta.down { color: var(--bad); } .delta.flat { color: var(--muted); }

/* tablas */
.tw { overflow-x: auto; max-width: 100%; position: relative; }
.stack > * { min-width: 0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--muted); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.r, th.r { text-align: right; }
tr:last-child td { border-bottom: 0; }

/* gráficas */
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.grid-l { stroke: var(--line); stroke-width: 1; }
.ax { fill: var(--muted); font: 12px var(--body); }
.hv { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 8px; }
.sw { display: inline-block; width: 14px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; max-width: 280px; display: none; white-space: pre-line; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: minmax(80px, 1fr) minmax(60px, 1.4fr) auto; gap: 10px; align-items: center; font-size: 14px; }
.bar .track { height: 12px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 4px; }
.tbl-toggle { font-size: 13px; }

/* mapa de calor: el visual distintivo */
.heat { display: grid; grid-template-columns: 54px repeat(24, minmax(0, 1fr)); gap: 3px; font-size: 11px; }
.heat .hl { color: var(--muted); align-self: center; font-size: 12px; }
.heat .hh { color: var(--muted); text-align: center; font-size: 11px; }
.heat .cell { aspect-ratio: 1 / 1; border-radius: 4px; min-height: 12px; }
.heat .cell.flash { animation: flash 1.6s ease-out 1; outline: 2px solid var(--accent); }
.heat.intro .cell { animation: aparece .5s ease-out backwards; }
@keyframes aparece { from { opacity: 0; transform: scale(.6); } }
@keyframes flash { 0% { filter: drop-shadow(0 0 8px var(--r5)) brightness(1.8); } 100% { filter: none; } }
@media (max-width: 640px) { .heat { grid-template-columns: 38px repeat(24, minmax(0, 1fr)); gap: 2px; } .heat .hh.skip { visibility: hidden; } }
.ramp { display: flex; gap: 3px; align-items: center; font-size: 12px; color: var(--muted); }
.ramp i { width: 18px; height: 10px; border-radius: 3px; display: inline-block; }

/* feed */
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; max-height: 470px; overflow-y: auto; }
.feed li { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 14px; }
.feed li.nuevo { animation: entra .5s ease-out; }
@keyframes entra { from { opacity: 0; transform: translateY(-8px); } }
.feed .t { font-size: 12px; color: var(--muted); white-space: nowrap; }
.feed li.real .t { color: var(--accent); font-weight: 600; }
.thumb { width: 34px; height: 34px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); display: block; }
.thumb.lg { width: 56px; height: 56px; }

/* hero y secciones */
.hero { padding: 56px 0 36px; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 36px; align-items: center; }
@media (max-width: 880px) { .hero { grid-template-columns: minmax(0, 1fr); padding-top: 32px; } }
.hero h1 { font: 700 clamp(34px, 5.2vw, 56px)/1.06 var(--display); letter-spacing: -0.02em; }
.hero p.sub { font-size: 18px; color: var(--muted); margin: 16px 0 24px; max-width: 54ch; }
.sec { padding: 36px 0; }
.sec > h2 { font: 700 clamp(26px, 3.4vw, 34px)/1.15 var(--display); margin-bottom: 8px; }
.sec > .lead { color: var(--muted); max-width: 62ch; margin-bottom: 22px; }
.step b { font: 700 28px var(--display); color: var(--accent); }
.post-prev { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 14px; word-break: break-word; }
.counter { font-size: 12px; color: var(--muted); }
.counter.bad { color: var(--bad); }
.badge-ok { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 12px; font-weight: 600; font-size: 14px; background: #123326; color: var(--ok); border: 1px solid #2a5a49; }
.badge-no { background: #3a1c18; color: var(--bad); border-color: #6b3028; }
.pass { color: var(--ok); } .fail { color: var(--bad); }
code, .mono { font-family: ui-monospace, Consolas, monospace; font-size: 13px; word-break: break-all; }

/* precios */
.founder { border-color: var(--accent); }
.plan { display: flex; flex-direction: column; gap: 10px; }
.plan .pr { font: 700 36px/1 var(--display); }
.plan ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
details.faq { border-bottom: 1px solid var(--line); padding: 12px 0; }
details.faq summary { cursor: pointer; font-weight: 600; }
details.faq p { color: var(--muted); margin-top: 8px; max-width: 70ch; }

/* modal y aviso */
.veil { position: fixed; inset: 0; background: rgba(5, 9, 7, .72); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 22px; max-width: 520px; width: 100%; max-height: 92vh; overflow-y: auto; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--accent); border-radius: 12px; padding: 10px 16px; z-index: 60; display: none; max-width: calc(100vw - 32px); }
footer { border-top: 1px solid var(--line); margin-top: 48px; padding: 28px 0 40px; color: var(--muted); font-size: 14px; }
footer p { max-width: 90ch; margin-bottom: 10px; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .heat.intro .cell, .heat .cell.flash, .feed li.nuevo { animation: none !important; }
  .chip.live { box-shadow: none; }
}

</style>
</head>
<body>
<a class="sr" href="#main">Saltar al contenido</a>
<div id="app"></div>
<div id="tip" role="tooltip"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ===== LÓGICA DE NEGOCIO DE PREGÓN =====
   Sin acceso a datos, sin DOM y sin red: solo funciones puras.
   Se puede probar en Node (ver test.mjs) y se reutiliza igual al migrar. */
const L = (() => {
  const pad = n => String(n).padStart(2, '0');
  const commas = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const fmtInt = n => commas(String(Math.round(n)));
  const fmtMXN = n => { const s = Math.abs(n).toFixed(2).split('.'); return (n < 0 ? '-' : '') + '$' + commas(s[0]) + '.' + s[1]; };
  const fmtPct = (n, d = 1) => n.toFixed(d) + ' %';

  // ---- Fechas (DD/MM/AAAA) y zona America/Mexico_City (UTC-6 todo el año desde 2022) ----
  const OFF = 6 * 3600e3;
  const dayIdx = (y, m, d) => Math.floor(Date.UTC(y, m - 1, d) / 864e5);
  const idxKey = i => { const dt = new Date(i * 864e5); return dt.getUTCFullYear() + '-' + pad(dt.getUTCMonth() + 1) + '-' + pad(dt.getUTCDate()); };
  const keyIdx = k => { const [y, m, d] = k.split('-').map(Number); return dayIdx(y, m, d); };
  const fmtDate = k => { const [y, m, d] = k.split('-'); return d + '/' + m + '/' + y; };
  const fmtShort = k => { const [, m, d] = k.split('-'); return d + '/' + m; };
  const parseDate = s => {
    const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(s).trim()); if (!m) return null;
    const d = +m[1], mo = +m[2], y = +m[3]; const dt = new Date(Date.UTC(y, mo - 1, d));
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return null;
    return y + '-' + pad(mo) + '-' + pad(d);
  };
  const parseHour = s => { const m = /^([01]\d|2[0-3]):([0-5]\d)$/.exec(String(s).trim()); return m ? { h: +m[1], mi: +m[2] } : null; };
  const mx = ms => { const dt = new Date(ms - OFF); return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate(), h: dt.getUTCHours(), mi: dt.getUTCMinutes(), dow: dt.getUTCDay(), di: Math.floor((ms - OFF) / 864e5) }; };
  const msOf = (key, h = 0, mi = 0) => { const [y, m, d] = key.split('-').map(Number); return Date.UTC(y, m - 1, d, h, mi) + OFF; };
  const fmtTime = ms => { const t = mx(ms); return pad(t.d) + '/' + pad(t.m) + '/' + t.y + ' ' + pad(t.h) + ':' + pad(t.mi); };
  const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

  // ---- Dinero ----
  const parseMoney = s => {
    const t = String(s).trim().replace(/\s/g, '');
    if (!/^\$?(\d{1,3}(,\d{3})+|\d+)(\.\d{1,2})?$/.test(t)) return null;
    return Number(t.replace(/[$,]/g, ''));
  };

  // ---- Datos mexicanos ----
  const RFC_TABLA = '0123456789ABCDEFGHIJKLMN&OPQRSTUVWXYZ Ñ';
  const rfcDigito = base => { // base: 11 (moral) o 12 (física) caracteres
    const s = base.length === 11 ? ' ' + base : base; let suma = 0;
    for (let i = 0; i < 12; i++) { const v = RFC_TABLA.indexOf(s[i]); if (v < 0) return null; suma += v * (13 - i); }
    const r = 11 - (suma % 11); return r === 11 ? '0' : r === 10 ? 'A' : String(r);
  };
  const validarRFC = raw => {
    const s = String(raw || '').trim().toUpperCase();
    if (!s) return { ok: false, error: 'Escribe el RFC.' };
    if (s.length !== 12 && s.length !== 13) return { ok: false, error: 'El RFC tiene 12 caracteres (persona moral) o 13 (persona física). El tuyo tiene ' + s.length + '.' };
    const fisica = s.length === 13;
    const re = fisica ? /^[A-ZÑ&]{4}(\d{2})(\d{2})(\d{2})[A-Z0-9]{3}$/ : /^[A-ZÑ&]{3}(\d{2})(\d{2})(\d{2})[A-Z0-9]{3}$/;
    const m = re.exec(s);
    if (!m) return { ok: false, error: fisica ? 'Un RFC de persona física lleva 4 letras, 6 números de fecha y 3 caracteres finales.' : 'Un RFC de persona moral lleva 3 letras, 6 números de fecha y 3 caracteres finales.' };
    const mes = +m[2], dia = +m[3];
    if (mes < 1 || mes > 12 || dia < 1 || dia > 31) return { ok: false, error: 'La fecha dentro del RFC no existe. Revisa los 6 números después de las letras.' };
    if (s === 'XAXX010101000' || s === 'XEXX010101000') return { ok: true, tipo: 'fisica', valor: s, generico: true };
    if (rfcDigito(s.slice(0, -1)) !== s.slice(-1)) return { ok: false, error: 'El último carácter del RFC no coincide. Revisa que no falte o sobre una letra o número.' };
    return { ok: true, tipo: fisica ? 'fisica' : 'moral', valor: s };
  };
  const conDigitoRFC = base => base + rfcDigito(base);
  const BANCOS = { '002': 'Banamex', '012': 'BBVA México', '014': 'Santander', '021': 'HSBC', '044': 'Scotiabank', '072': 'Banorte', '127': 'Azteca', '137': 'BanCoppel', '138': 'Ualá', '646': 'STP' };
  const clabeDigito = c17 => { const w = [3, 7, 1]; let s = 0; for (let i = 0; i < 17; i++) s += (Number(c17[i]) * w[i % 3]) % 10; return String((10 - (s % 10)) % 10); };
  const validarCLABE = raw => {
    const s = String(raw || '').replace(/[\s-]/g, '');
    if (!s) return { ok: false, error: 'Escribe la CLABE.' };
    if (!/^\d+$/.test(s)) return { ok: false, error: 'La CLABE solo lleva números.' };
    if (s.length !== 18) return { ok: false, error: 'La CLABE tiene 18 dígitos. La tuya tiene ' + s.length + '.' };
    if (clabeDigito(s.slice(0, 17)) !== s[17]) return { ok: false, error: 'El último dígito de la CLABE no coincide. Revisa que no haya un número cambiado.' };
    return { ok: true, valor: s, banco: BANCOS[s.slice(0, 3)] || 'Banco no listado' };
  };
  const conDigitoCLABE = c17 => c17 + clabeDigito(c17);
  const validarTel = raw => {
    let s = String(raw || '').replace(/[\s().-]/g, '');
    if (!s) return { ok: false, error: 'Escribe el teléfono de WhatsApp.' };
    s = s.replace(/^\+?52/, '').replace(/^1(?=\d{10}$)/, '');
    if (!/^\d+$/.test(s)) return { ok: false, error: 'El teléfono solo lleva números.' };
    if (s.length !== 10) return { ok: false, error: 'El teléfono debe tener 10 dígitos, sin +52 ni 044. El tuyo tiene ' + s.length + '.' };
    return { ok: true, valor: s };
  };
  const validarCP = raw => {
    const s = String(raw || '').trim();
    if (!/^\d{5}$/.test(s)) return { ok: false, error: 'El código postal tiene 5 números.' };
    if (s === '00000') return { ok: false, error: 'Ese código postal no existe.' };
    return { ok: true, valor: s };
  };
  const REGIMENES = { '601': 'General de Ley Personas Morales', '603': 'Personas Morales con Fines no Lucrativos', '605': 'Sueldos y Salarios', '606': 'Arrendamiento', '612': 'Personas Físicas con Actividades Empresariales y Profesionales', '621': 'Incorporación Fiscal', '625': 'Actividades Empresariales con ingresos a través de Plataformas Tecnológicas', '626': 'Régimen Simplificado de Confianza (RESICO)' };
  const maskRFC = r => r ? r.slice(0, 3) + '•'.repeat(Math.max(0, r.length - 5)) + r.slice(-2) : '';
  const maskTel = t => t && t.length === 10 ? t.slice(0, 3) + ' ••• ••' + t.slice(-2) : '';
  const maskCLABE = c => c ? c.slice(0, 3) + ' •••••••••••• ' + c.slice(-3) : '';
  const fmtTel = t => t.slice(0, 3) + ' ' + t.slice(3, 6) + ' ' + t.slice(6);

  // ---- Estados de la República (Otros se agrupa al mostrar) ----
  const ESTADOS = ['Aguascalientes', 'Baja California', 'Baja California Sur', 'Campeche', 'Chiapas', 'Chihuahua', 'Ciudad de México', 'Coahuila', 'Colima', 'Durango', 'Estado de México', 'Guanajuato', 'Guerrero', 'Hidalgo', 'Jalisco', 'Michoacán', 'Morelos', 'Nayarit', 'Nuevo León', 'Oaxaca', 'Puebla', 'Querétaro', 'Quintana Roo', 'San Luis Potosí', 'Sinaloa', 'Sonora', 'Tabasco', 'Tamaulipas', 'Tlaxcala', 'Veracruz', 'Yucatán', 'Zacatecas'];
  const CANALES = {
    instagram: { nombre: 'Instagram', max: 2200, tags: 8 },
    facebook: { nombre: 'Facebook', max: 63206, tags: 0 },
    whatsapp: { nombre: 'WhatsApp Estado', max: 700, tags: 0 },
    tiktok: { nombre: 'TikTok', max: 2200, tags: 5 },
    google: { nombre: 'Google Business', max: 1500, tags: 0 }
  };
  const OCASIONES = [
    { id: 'ninguna', n: 'Sin fecha especial', linea: '', tags: [] },

const PAGOS = [['SPEI', 46], ['Tarjeta (enlace de pago)', 28], ['Depósito en tienda', 14], ['Contra entrega', 12]];
const pick = (rng, tabla) => { const t = tabla.reduce((a, x) => a + x[1], 0); let r = rng() * t; for (const x of tabla) { r -= x[1]; if (r <= 0) return x[0]; } return tabla[0][0]; };
const gauss = (di, centro, ancho, amp) => amp * Math.exp(-0.5 * Math.pow((di - L.keyIdx(centro)) / ancho, 2));

const factorFecha = (di, d, dim) => {
  let f = 1;
  if (d === 15) f *= 1.38; else if (d === 14 || d === 16) f *= 1.14;
  if (d === dim || d === 30) f *= 1.35; else if (d === dim - 1 || d === 29) f *= 1.12; else if (d === 1) f *= 1.1;
  if (d >= dim - 2) f *= 1.06; // cierre de mes fiscal: suben los pedidos de negocios
  f *= 1 + gauss(di, '2026-08-31', 2.5, 0.25) + gauss(di, '2026-09-14', 3.2, 1.3) + gauss(di, '2026-10-31', 2.8, 0.75) + gauss(di, '2026-11-14', 5, 0.2);
  return f;
};

const buildDemoMsgs = (posts, finIdx, ahora) => {
  const ini = L.keyIdx('2026-05-10'); const out = [];
  const pDi = posts.map(p => L.keyIdx(p.fecha));
  for (let di = ini; di <= finIdx; di++) {
    const rng = mulberry32(((di * 2654435761) ^ SEED) >>> 0);
    const dt = new Date(di * 864e5); const d = dt.getUTCDate(), dow = dt.getUTCDay();
    const dim = new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 0)).getUTCDate();
    const base = 22 * (1 + 0.0019 * (di - ini)) * SEMANA[dow] * factorFecha(di, d, dim) * (1 + (rng() - 0.5) * 0.36);
    const n = Math.round(base);
    const w = posts.map((p, i) => di >= pDi[i] ? p.q * (Math.exp(-(di - pDi[i]) / 10) + 0.07) : 0);
    const wt = w.reduce((a, b) => a + b, 0); if (!wt) continue;
    for (let k = 0; k < n; k++) {
      let r = rng() * wt, pi = 0; for (; pi < w.length - 1; pi++) { r -= w[pi]; if (r <= 0) break; }
      const p = posts[pi];
      const canal = pick(rng, p.canales.map(c => [c, CANAL_PESO[c]]));
      const h = Number(pick(rng, HORAS.map((x, i) => [i, x]))); const mi = Math.floor(rng() * 60);
      const ts = L.msOf(L.idxKey(di), h, mi); if (ts > ahora) continue;
      const estado = pick(rng, ESTADOS_PESO);
      let venta = 0, pago = '';
      if (rng() < 0.31 + (p.precio ? 0.04 : 0)) {
        const qty = [1, 1, 1, 2, 2, 3, 4][Math.floor(rng() * 7)]; const unit = p.precio || 118.5;
        const sub = unit * qty; venta = Math.round((sub + (sub >= 299 ? 0 : 89)) * 100) / 100; pago = pick(rng, PAGOS);
      }
      out.push({ id: 's' + di + '-' + k, postId: p.id, canal, ts, di, h, dow, estado, venta, pago, real: false });
    }
  }
  return out;
};

    const s = Store.caps.sample; if (!s || !GEN) return; const it = GEN.items[0]; const orig = it.res.resultados; toast('Reescribiendo…', 8000);
    try {
      const pedido = 'Reescribe estas publicaciones de redes sociales en español de México, con tono ' + it.input.tono + ', sin inventar precios ni datos. Conserva exactamente los enlaces, el código de referencia ' + it.res.ref + ' y los precios. Devuelve solo JSON con las llaves ' + JSON.stringify(orig.map(x => x.canal)) + ' y el texto de cada una. Límites de letras: ' + JSON.stringify(Object.fromEntries(orig.map(x => [x.canal, x.max]))) + '. Textos: ' + JSON.stringify(Object.fromEntries(orig.map(x => [x.canal, x.texto])));
      const j = await s.json(pedido, { modelTier: 'quick' }); let cambios = 0;
      orig.forEach(x => { const n = j && j[x.canal]; if (typeof n === 'string' && n.length <= x.max && n.includes(it.res.ref) && (!it.res.datos.precio || n.includes(L.fmtMXN(it.res.datos.precio)))) { x.texto = n; x.largo = n.length; x.ok = true; cambios++; } });
      $('#prev').innerHTML = prevHtml(); toast(cambios ? 'Listo: reescribí ' + cambios + ' texto(s) y verifiqué límites, precio y referencia.' : 'La IA no devolvió textos válidos. Dejé los originales.');
    } catch (e) { toast('No pude usar la IA ahora. Dejé los textos originales.'); }
  },
  regenerar: t => {
    const w = getWS(S.ws); const p = w.byId[t.dataset.id]; if (!w.meta.tel) return toast('Primero guarda una publicación con tu WhatsApp en “Crear”.');
    const g = L.generar({ negocio: w.meta.nombre, ciudad: w.meta.ciudad, tel: w.meta.tel, producto: p.producto, precio: p.precio === null ? '' : p.precio, ocasion: OCASION_DE[p.producto] || 'ninguna', tono: 'cercano', canales: p.canales, fecha: p.fecha, hora: p.hora || '12:00', ref: p.ref });
    if (!g.ok) return toast(Object.values(g.errores)[0]); const textos = {}; g.resultados.forEach(x => textos[x.canal] = x.texto); setCampo(p.id, 'textos', textos); S.keep = true; render(); toast('Textos regenerados.');
  },
  regMsg: t => {
    const w = getWS(S.ws); if (!w.posts.length) return toast('Primero crea una publicación.'); const sel = t.dataset.id || w.posts.slice().sort((a, b) => b.fecha.localeCompare(a.fecha))[0].id;
    modal('<h2>Registrar un mensaje</h2><p class="muted" style="margin:4px 0 12px">Sin teléfono ni nombre del cliente. Solo lo necesario para medir.</p><div class="stack"><div class="field"><label for="r-post">Publicación</label><select id="r-post">' + w.posts.map(p => '<option value="' + p.id + '"' + (p.id === sel ? ' selected' : '') + '>' + esc(p.producto) + ' (' + esc(p.ref) + ')</option>').join('') + '</select></div><div class="field"><label for="r-canal">Canal</label><select id="r-canal">' + Object.entries(L.CANALES).map(([k, c]) => '<option value="' + k + '">' + c.nombre + '</option>').join('') + '</select></div><div class="field"><label for="r-estado">Estado de la República (opcional)</label><select id="r-estado"><option value="">No sé</option>' + L.ESTADOS.map(e => '<option>' + e + '</option>').join('') + '</select></div><label style="display:flex;gap:8px;align-items:center;margin:0;color:var(--text)"><input type="checkbox" id="r-venta"> Hubo venta</label><div id="r-vbloque" hidden class="stack"><div class="field"><label for="r-monto">Monto en MXN, IVA incluido</label><input id="r-monto" inputmode="decimal" placeholder="277.50"></div><div class="field"><label for="r-pago">Forma de pago</label><select id="r-pago"><option>SPEI</option><option>Tarjeta (enlace de pago)</option><option>Depósito en tienda</option><option>Contra entrega</option></select></div></div><p class="err" id="r-err" role="alert"></p><div class="row"><button class="btn pri" data-act="guardarMsg">Guardar</button><button class="btn" data-act="cerrar">Cancelar</button></div></div>');
  },
  guardarMsg: () => {
    const w = getWS(S.ws); const postId = $('#r-post').value; const canal = $('#r-canal').value; const hay = $('#r-venta').checked; let monto = 0;
    if (hay) { monto = L.parseMoney($('#r-monto').value); if (!monto || monto <= 0) { $('#r-err').textContent = 'El monto no es válido. Escribe solo números, por ejemplo 277.50.'; return; } }
    const now = Date.now(), t = L.mx(now); const m = { id: 'x' + now.toString(36), postId, canal, ts: now, di: t.di, h: t.h, dow: t.dow, estado: $('#r-estado').value, venta: monto, pago: hay ? $('#r-pago').value : '', real: true };
    w.R.msgs.push(m); evento('mensaje_recibido', { postId, canal, producto: w.byId[postId].producto }); if (hay) evento('venta_registrada', { postId, monto, pago: m.pago, producto: w.byId[postId].producto }); guardar();
    cerrar(); S.flash = { dow: t.dow, h: t.h }; S.nuevoId = m.id; S.keep = true; render(); toast(hay ? 'Venta registrada. Ya está en la actividad en vivo.' : 'Mensaje registrado. Ya está en la actividad en vivo.');
  },
  cerrar,
  importarRes: () => {
    const w = getWS(S.ws); const refs = w.posts.map(p => p.ref); const r = L.importarResultadosCSV($('#imp-res').value, refs); const er = $('#er-imp');
    const errs = [...r.errores]; const ok = [];
    r.filas.forEach(f => { const p = w.posts.find(x => x.ref === f.ref); if (!p.canales.includes(f.canal)) errs.push('La publicación ' + f.ref + ' no se publicó en ' + L.CANALES[f.canal].nombre + '.'); else ok.push([p, f]); });
    if (errs.length) { er.textContent = errs.slice(0, 4).join(' ') + (errs.length > 4 ? ' (y ' + (errs.length - 4) + ' más)' : ''); return; }
    if (!ok.length) { er.textContent = 'No hay filas para importar.'; return; }
    er.textContent = ''; const R = getReal(S.ws); ok.forEach(([p, f]) => { const k = p.id + '|' + f.canal; const ex = w.met[k] || {}; R.metricas[k] = Object.assign({}, ex, { alcance: f.alcance, likes: f.likes, comentarios: f.comentarios, guardados: f.guardados, clics: f.clics }, { demo: false }); evento('resultados_capturados', { postId: p.id, canal: f.canal, producto: p.producto }); }); guardar(); S.keep = true; render(); toast('Importé ' + ok.length + ' resultado(s).');
  },
  crearMio: () => { location.hash = 'mi'; },
  respaldo: async () => {
    const R = getReal(S.ws); const m = metaDe(S.ws);
    const data = JSON.stringify({ app: 'pregon', version: 1, creado: new Date().toISOString(), espacio: { meta: R.meta || m, posts: R.posts, msgs: R.msgs, clicks: R.clicks || [], edits: R.edits || {}, metricas: R.metricas || {}, eventos: R.eventos || [] } }, null, 1);
    const r = await Store.descargar('pregon-respaldo-' + L.idxKey(HOY()) + '.json', data, 'application/json');
    if (r !== 'guardado') copiar(data, 'Tu navegador no permite descargar aquí. Copié el respaldo: pégalo en un archivo .json.'); else toast('Respaldo descargado.');
  },
  restaurarOk: () => {
    if (!RESTORE) return cerrar(); const R = getReal(S.ws); Object.assign(R, Store.vacio(), RESTORE); R.meta = Object.assign({ id: S.ws, demo: false }, RESTORE.meta, { id: S.ws, demo: false }); guardar(); RESTORE = null; cerrar(); S.keep = true; render(); toast('Respaldo restaurado.');
  },
  verEnlace: () => {
    const url = location.href.split('#')[0] + '#e-' + S.ws; const wa = 'https://wa.me/?text=' + encodeURIComponent('Mi espacio privado en Pregón: ' + url);
    modal('<h2>Tu enlace secreto</h2><p class="muted" style="margin:6px 0 12px">Quien tenga este enlace entra a tu espacio, sin contraseña. Guárdalo o mándalo a tu WhatsApp. ' + (Store.caps.db ? '' : 'Ojo: sin base de datos, tus datos viven solo en este navegador.') + '</p><input readonly id="m-url" value="' + esc(url) + '"><div class="row" style="margin-top:12px"><button class="btn pri" data-act="copiarUrl" data-u="' + esc(url) + '">Copiar enlace</button><a class="btn" href="' + wa + '" target="_blank" rel="noopener" data-act="clicWa">Enviarlo por WhatsApp</a><button class="btn" data-act="cerrar">Cerrar</button></div>');
  },
  copiarUrl: t => copiar(t.dataset.u, 'Enlace copiado.'),
  guardarCfg: async () => {
    const v = parseInt($('#m-vend').value, 10); const u = $('#m-url').value.trim(); const er = $('#er-cfg');
    if (!(v >= 0 && v <= CONFIG.FOUNDER_SEATS)) { er.textContent = 'Los lugares vendidos deben ser un número entre 0 y ' + CONFIG.FOUNDER_SEATS + '.'; return; }
    if (u && !/^https:\/\/wa\.me\/\d+/.test(u)) { er.textContent = 'El enlace debe empezar con https://wa.me/ y el número con lada, por ejemplo https://wa.me/52XXXXXXXXXX?text=…'; return; }
    er.textContent = ''; const ok = await Store.guardarConfig({ FOUNDER_SOLD: v, FOUNDER_PAYMENT_URL: u }); toast(ok ? 'Guardado.' : 'No pude guardar en la base de datos.');
  }
};
const setCampo = (id, campo, valor) => { const R = getReal(S.ws); const p = R.posts.find(x => x.id === id); if (p) p[campo] = valor; else (R.edits[id] = R.edits[id] || {})[campo] = valor; guardar(); };
const CHG = {
  canal: t => { S.canal = t.value; S.keep = true; render(); },
  comparar: t => { S.comparar = t.checked; S.keep = true; render(); },
  archivo: t => { const f = t.files[0]; if (!f) return; if (f.size > 500000) return toast('El archivo es muy grande. El máximo es 500 KB.'); const r = new FileReader(); r.onload = () => { FORM().csv = String(r.result); S.keep = true; render(); toast('Archivo cargado: ' + f.name); }; r.readAsText(f, 'utf-8'); },
  edit: t => {
    const id = t.dataset.id, f = t.dataset.f, v = t.value.trim(); let val = v;
    if (f === 'precio') { val = v === '' ? null : L.parseMoney(v); if (v !== '' && (val === null || val <= 0)) { toast('El precio no es válido. Escribe solo números, por ejemplo 120 o 120.50.'); S.keep = true; return render(); } }
    if (f === 'fecha') { val = L.parseDate(v); if (!val) { toast('La fecha debe ir como DD/MM/AAAA, por ejemplo 20/11/2026.'); S.keep = true; return render(); } }
    if (f === 'producto' && (v.length < 2 || v.length > 80)) { toast('El nombre debe tener entre 2 y 80 letras.'); S.keep = true; return render(); }
    setCampo(id, f, val); toast('Guardado.');
  },
  restaurar: t => {
    const f = t.files[0]; t.value = ''; if (!f) return; if (f.size > 5000000) return toast('El respaldo es muy grande. El máximo es 5 MB.');
    const r = new FileReader(); r.onload = () => {
      try {
        const j = JSON.parse(String(r.result)); const e = j && j.espacio;
        const okPost = p => p && typeof p.id === 'string' && typeof p.producto === 'string' && typeof p.ref === 'string' && Array.isArray(p.canales) && typeof p.fecha === 'string';
        const okMsg = m => m && typeof m.postId === 'string' && typeof m.ts === 'number' && typeof m.canal === 'string' && L.CANALES[m.canal];
        if (!j || j.app !== 'pregon' || !e || !Array.isArray(e.posts) || !Array.isArray(e.msgs) || !e.posts.every(okPost) || !e.msgs.every(okMsg)) return toast('Ese archivo no es un respaldo de Pregón válido.');
        RESTORE = { meta: e.meta || null, posts: e.posts, msgs: e.msgs.map(m => Object.assign({}, m, { di: L.mx(m.ts).di, h: L.mx(m.ts).h, dow: L.mx(m.ts).dow })), clicks: Array.isArray(e.clicks) ? e.clicks : [], edits: e.edits && typeof e.edits === 'object' ? e.edits : {}, metricas: e.metricas && typeof e.metricas === 'object' ? e.metricas : {}, eventos: Array.isArray(e.eventos) ? e.eventos : [] };
        modal('<h2>Restaurar respaldo</h2><p class="muted" style="margin:6px 0 12px">El respaldo trae ' + L.fmtInt(e.posts.length) + ' publicaciones y ' + L.fmtInt(e.msgs.length) + ' mensajes. <b style="color:var(--text)">Reemplaza lo que tienes ahora en este navegador.</b> Si dudas, cancela y descarga primero un respaldo de lo actual.</p><div class="row"><button class="btn pri" data-act="restaurarOk">Reemplazar y restaurar</button><button class="btn" data-act="cerrar">Cancelar</button></div>');
      } catch (err) { toast('No pude leer ese archivo. Elige un respaldo .json de Pregón.'); }
    }; r.readAsText(f, 'utf-8');
  },
  archivoRes: t => { const f = t.files[0]; if (!f) return; if (f.size > 500000) return toast('El archivo es muy grande. El máximo es 500 KB.'); const r = new FileReader(); r.onload = () => { $('#imp-res').value = String(r.result); toast('Archivo cargado: ' + f.name + '. Toca “Importar resultados”.'); }; r.readAsText(f, 'utf-8'); },
  res: t => {
    const p = L.parseEntero(t.value); if (!p.ok) { toast('Escribe solo un número entero, por ejemplo 1250, o deja la casilla vacía.'); S.keep = true; return render(); }
    const w = getWS(S.ws); const R = getReal(S.ws); const k = t.dataset.id + '|' + t.dataset.c; const ex = w.met[k] || {};
    R.metricas[k] = Object.assign({}, ex, { [t.dataset.f]: p.v, demo: false }); evento('resultados_capturados', { postId: t.dataset.id, canal: t.dataset.c, producto: w.byId[t.dataset.id].producto }); guardar(); toast('Resultado guardado.');
  },
  texto: t => { const w = getWS(S.ws); const p = w.byId[t.dataset.id]; const c = t.dataset.c; const max = L.CANALES[c].max; if (t.value.length > max) { toast('El texto pasa el límite de ' + L.CANALES[c].nombre + ' (' + L.fmtInt(max) + ' letras). Acórtalo.'); return; } setCampo(p.id, 'textos', Object.assign({}, p.textos, { [c]: t.value })); toast('Texto guardado.'); }
};
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t) return; const fn = ACT[t.dataset.act]; if (fn) { if (t.tagName === 'A' && ['irDemo'].includes(t.dataset.act) === false && t.dataset.act !== 'clicWa' && t.dataset.act !== 'clicPago') e.preventDefault(); fn(t, e); } });
document.addEventListener('change', e => { const t = e.target.closest('[data-chg]'); if (t && CHG[t.dataset.chg]) CHG[t.dataset.chg](t); if (e.target.id === 'f-spei') $('#bloque-clabe').hidden = !e.target.checked; if (e.target.id === 'r-venta') $('#r-vbloque').hidden = !e.target.checked; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrar(); });

// tooltips: el número exacto de cada punto, barra o celda
const tip = () => $('#tip');
document.addEventListener('pointermove', e => {
  const tp = tip(); let txt = null; const el = e.target.closest ? e.target.closest('[data-tip]') : null; const ch = e.target.closest ? e.target.closest('.chart') : null;
  document.querySelectorAll('.hv').forEach(l => l.style.opacity = 0);
  if (ch && CHARTS[ch.dataset.chart]) {
    const C = CHARTS[ch.dataset.chart]; const svg = ch.querySelector('svg'); const r = svg.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width * C.W; const iw = C.W - C.ml - C.mr; const i = Math.max(0, Math.min(C.n - 1, Math.round((x - C.ml) / iw * (C.n - 1))));
    const hv = svg.querySelector('.hv'); const px = C.ml + (C.n < 2 ? iw / 2 : i * iw / (C.n - 1)); hv.setAttribute('x1', px); hv.setAttribute('x2', px); hv.style.opacity = 1;
    txt = C.labels[i] + '\n' + C.series.map(s => s.name + ': ' + C.yFmt(s.values[i]).replace(/^\$(\d)/, '$$$1')).join('\n'); if (C.yFmt(1).startsWith('$')) txt = C.labels[i] + '\n' + C.series.map(s => s.name + ': ' + L.fmtMXN(s.values[i])).join('\n'); else txt = C.labels[i] + '\n' + C.series.map(s => s.name + ': ' + L.fmtInt(s.values[i]) + ' mensajes').join('\n');
  } else if (el) txt = el.dataset.tip;
  if (txt) { tp.textContent = txt; tp.style.display = 'block'; tp.style.left = Math.min(e.clientX + 14, innerWidth - 290) + 'px'; tp.style.top = (e.clientY + 14) + 'px'; } else tp.style.display = 'none';
});
setInterval(() => document.querySelectorAll('[data-ts]').forEach(e => { e.textContent = relLabel(+e.dataset.ts, e.dataset.real === '1'); }), 5000);
setInterval(async () => {
  const c0 = Store.getConfig(), antes = c0.FOUNDER_SEATS + '/' + c0.FOUNDER_SOLD; if (!(await Store.leerFundadores())) return;
  const c1 = Store.getConfig(); if (c1.FOUNDER_SEATS + '/' + c1.FOUNDER_SOLD !== antes && ['precios', 'inicio'].includes(S.route)) { S.keep = true; render(); toast('Se actualizó el contador de lugares.'); }
}, 60000);
window.addEventListener('hashchange', ruta);
Store.init().then(async () => { await Store.cargarConfig(); if (['metricas', 'precios', 'inicio'].includes(S.route)) render(); });
ruta();

</script>
